name: Verify changes
on:
  push:
    branches: [feat/**]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cat dist/index.html
      - run: test -f dist/index.html && grep -q 'Space-Room' dist/index.html
